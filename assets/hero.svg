<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">runhug — Find. Deploy. Run.</title>
  <desc id="desc">Hero art for runhug: Find/Deploy/Run tagline, numbered HF→RunPod→OpenAI steps, and a clean CLI terminal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <linearGradient id="termTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="220" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="160" cy="560" r="180" fill="#2dd4bf" opacity="0.08" filter="url(#soft)"/>

  <!-- Left copy -->
  <text x="72" y="118" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700" letter-spacing="4" fill="#5eead4">RUNHUG</text>
  <text x="72" y="190" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="700" fill="#f8fafc">Find the best model.</text>
  <text x="72" y="248" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="700" fill="#f8fafc">Deploy it in minutes.</text>
  <text x="72" y="306" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="700" fill="#f8fafc">Run it for pennies.</text>
  <!-- Flow steps (vertical, left column — clear of terminal) -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18">
    <text x="72" y="358" fill="#5eead4" font-weight="700">1</text>
    <text x="96" y="358" fill="#94a3b8">Hugging Face search</text>
    <text x="72" y="390" fill="#5eead4" font-weight="700">2</text>
    <text x="96" y="390" fill="#94a3b8">RunPod serverless vLLM or GCP COS</text>
    <text x="72" y="422" fill="#5eead4" font-weight="700">3</text>
    <text x="96" y="422" fill="#94a3b8">Use it anywhere.</text>
    <text x="96" y="422" fill="#94a3b8">*OpenAI Compatible URL, Claude Code, OpenCode, and more.*</text>

  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600">
    <rect x="72" y="460" rx="999" ry="999" width="86" height="32" fill="#134e4a"/>
    <text x="115" y="481" text-anchor="middle" fill="#99f6e4">QUEUE</text>
    <rect x="168" y="460" rx="999" ry="999" width="78" height="32" fill="#1e3a5f"/>
    <text x="207" y="481" text-anchor="middle" fill="#bae6fd">vLLM</text>
    <rect x="256" y="460" rx="999" ry="999" width="70" height="32" fill="#312e81"/>
    <text x="291" y="481" text-anchor="middle" fill="#c7d2fe">CLI</text>
  </g>

  <!-- Terminal -->
  <g transform="translate(620,70)">
    <rect width="580" height="500" rx="16" ry="16" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <rect width="580" height="44" rx="16" ry="16" fill="url(#termTop)"/>
    <rect y="28" width="580" height="16" fill="url(#termTop)"/>
    <circle cx="28" cy="22" r="6" fill="#f87171"/>
    <circle cx="50" cy="22" r="6" fill="#fbbf24"/>
    <circle cx="72" cy="22" r="6" fill="#34d399"/>
    <text x="290" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#64748b">runhug</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e2e8f0">
      <text x="28" y="78" fill="#2dd4bf" xml:space="preserve"> ____  _   _ _   _ _   _ _   _  ____</text>
      <text x="28" y="96" fill="#2dd4bf" xml:space="preserve">|  _ \| | | | \ | | | | | | | |/ ___|</text>
      <text x="28" y="114" fill="#2dd4bf" xml:space="preserve">| |_) | | | |  \| | |_| | | | | |  _</text>
      <text x="28" y="132" fill="#2dd4bf" xml:space="preserve">|  _ &lt;| |_| | |\  |  _  | |_| | |_| |</text>
      <text x="28" y="150" fill="#2dd4bf" xml:space="preserve">|_| \_\\___/|_| \_|_| |_|\___/ \____|</text>

      <text x="28" y="186"><tspan fill="#f8fafc" font-weight="700">runhug</tspan><tspan fill="#94a3b8"> 0.1.4 — find · deploy · run for pennies</tspan></text>

      <text x="28" y="222" fill="#64748b">Usage:</text>
      <text x="28" y="244" xml:space="preserve">  runhug &lt;command&gt; [flags]</text>

      <text x="28" y="280" fill="#5eead4" font-weight="700">Setup</text>
      <text x="28" y="302" xml:space="preserve">  wizard    guided setup</text>
      <text x="28" y="320" xml:space="preserve">  init      search NLP + packs</text>
      <text x="28" y="338" xml:space="preserve">  connect   RunPod API key</text>

      <text x="28" y="370" fill="#5eead4" font-weight="700">Search</text>
      <text x="28" y="392" xml:space="preserve">  search / recommend / inspect</text>

      <text x="28" y="424" fill="#5eead4" font-weight="700">RunPod</text>
      <text x="28" y="446" xml:space="preserve">  deploy    QUEUE vLLM (min=0)</text>
      <text x="28" y="464" xml:space="preserve">  list  proxy  run  start</text>

      <text x="28" y="500" fill="#64748b">$</text>
      <text x="44" y="500" fill="#e2e8f0">runhug deploy Qwen/Qwen2.5-0.5B-Instruct</text>
      <rect x="392" y="488" width="8" height="16" fill="#2dd4bf">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
