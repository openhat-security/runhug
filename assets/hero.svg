<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">runhug — Find. Deploy. Run. Any model.</title>
  <desc id="desc">Hero art for runhug: Find/Deploy/Run tagline, Claude Code / OpenCode / RunPod / GCP marks, and a CLI terminal. Deploy any Hugging Face model, including heretic builds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <linearGradient id="termTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="220" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="160" cy="560" r="180" fill="#2dd4bf" opacity="0.08" filter="url(#soft)"/>

  <text x="72" y="88" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="700" letter-spacing="4" fill="#5eead4">RUNHUG</text>
  <text x="72" y="148" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">Find the best model.</text>
  <text x="72" y="200" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">Deploy it in minutes.</text>
  <text x="72" y="252" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">Run it for pennies.</text>
  <text x="72" y="298" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#99f6e4">Deploy ANY model — including abliterated heretic builds.</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">
    <text x="72" y="340" fill="#5eead4" font-weight="700">1</text>
    <text x="96" y="340" fill="#94a3b8">Hugging Face search</text>
    <text x="72" y="368" fill="#5eead4" font-weight="700">2</text>
    <text x="96" y="368" fill="#94a3b8">RunPod serverless vLLM or GCP llama.cpp</text>
    <text x="72" y="396" fill="#5eead4" font-weight="700">3</text>
    <text x="96" y="396" fill="#94a3b8">OpenAI-compatible URL · Claude Code · OpenCode</text>
  </g>

  <!-- Works with -->
  <text x="72" y="438" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#64748b">WORKS WITH</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600">
    <!-- RunPod -->
    <rect x="72" y="452" rx="10" ry="10" width="122" height="40" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <circle cx="94" cy="472" r="8" fill="#818cf8"/>
    <text x="110" y="477" fill="#c7d2fe">RunPod</text>
    <!-- GCP -->
    <rect x="204" y="452" rx="10" ry="10" width="108" height="40" fill="#172554" stroke="#38bdf8" stroke-width="1"/>
    <rect x="218" y="464" width="12" height="16" rx="2" fill="#38bdf8"/>
    <text x="236" y="477" fill="#bae6fd">GCP</text>
    <!-- Claude Code -->
    <rect x="322" y="452" rx="10" ry="10" width="148" height="40" fill="#431407" stroke="#fb923c" stroke-width="1"/>
    <path d="M338 464 l8 16 l8 -16" fill="none" stroke="#fdba74" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="360" y="477" fill="#fed7aa">Claude Code</text>
    <!-- OpenCode -->
    <rect x="480" y="452" rx="10" ry="10" width="132" height="40" fill="#042f2e" stroke="#2dd4bf" stroke-width="1"/>
    <rect x="494" y="464" width="16" height="16" rx="3" fill="none" stroke="#5eead4" stroke-width="1.8"/>
    <text x="516" y="477" fill="#99f6e4">OpenCode</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600">
    <rect x="72" y="508" rx="999" ry="999" width="86" height="28" fill="#134e4a"/>
    <text x="115" y="527" text-anchor="middle" fill="#99f6e4">QUEUE</text>
    <rect x="168" y="508" rx="999" ry="999" width="70" height="28" fill="#1e3a5f"/>
    <text x="203" y="527" text-anchor="middle" fill="#bae6fd">vLLM</text>
    <rect x="248" y="508" rx="999" ry="999" width="88" height="28" fill="#312e81"/>
    <text x="292" y="527" text-anchor="middle" fill="#c7d2fe">heretic</text>
    <rect x="346" y="508" rx="999" ry="999" width="62" height="28" fill="#164e63"/>
    <text x="377" y="527" text-anchor="middle" fill="#a5f3fc">any</text>
  </g>

  <!-- Terminal -->
  <g transform="translate(640,48)">
    <rect width="568" height="544" rx="16" ry="16" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <rect width="568" height="44" rx="16" ry="16" fill="url(#termTop)"/>
    <rect y="28" width="568" height="16" fill="url(#termTop)"/>
    <circle cx="28" cy="22" r="6" fill="#f87171"/>
    <circle cx="50" cy="22" r="6" fill="#fbbf24"/>
    <circle cx="72" cy="22" r="6" fill="#34d399"/>
    <text x="284" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#64748b">runhug</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e2e8f0">
      <text x="28" y="78" fill="#2dd4bf" xml:space="preserve"> ____  _   _ _   _ _   _ _   _  ____</text>
      <text x="28" y="96" fill="#2dd4bf" xml:space="preserve">|  _ \| | | | \ | | | | | | | |/ ___|</text>
      <text x="28" y="114" fill="#2dd4bf" xml:space="preserve">| |_) | | | |  \| | |_| | | | | |  _</text>
      <text x="28" y="132" fill="#2dd4bf" xml:space="preserve">|  _ &lt;| |_| | |\  |  _  | |_| | |_| |</text>
      <text x="28" y="150" fill="#2dd4bf" xml:space="preserve">|_| \_\\___/|_| \_|_| |_|\___/ \____|</text>

      <text x="28" y="186"><tspan fill="#f8fafc" font-weight="700">runhug</tspan><tspan fill="#94a3b8"> — find · deploy any model · run for pennies</tspan></text>

      <text x="28" y="222" fill="#64748b">Usage:</text>
      <text x="28" y="244" xml:space="preserve">  runhug &lt;command&gt; [flags]</text>

      <text x="28" y="280" fill="#5eead4" font-weight="700">Setup</text>
      <text x="28" y="302" xml:space="preserve">  wizard    guided setup</text>
      <text x="28" y="320" xml:space="preserve">  init      search NLP + packs</text>
      <text x="28" y="338" xml:space="preserve">  connect   RunPod · HF tokens</text>

      <text x="28" y="370" fill="#5eead4" font-weight="700">Search</text>
      <text x="28" y="392" xml:space="preserve">  search / recommend / inspect</text>

      <text x="28" y="424" fill="#5eead4" font-weight="700">Deploy</text>
      <text x="28" y="446" xml:space="preserve">  deploy    RunPod serverless vLLM</text>
      <text x="28" y="464" xml:space="preserve">  gcp       Spot L4/T4 llama.cpp</text>
      <text x="28" y="482" xml:space="preserve">  heretic   abliterate any checkpoint</text>

      <text x="28" y="518" fill="#64748b">$</text>
      <text x="44" y="518" fill="#e2e8f0">runhug deploy Qwen/Qwen2.5-0.5B-Instruct</text>
      <rect x="428" y="506" width="8" height="16" fill="#2dd4bf"/>
    </g>
  </g>
</svg>
