name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o /tmp/runhug ./cmd/runhug

  heretic-container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: containers/heretic
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r tests/requirements.txt
      - run: python3 -m unittest discover -s tests -v
